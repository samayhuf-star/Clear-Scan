appId: com.samayhuf.clearscan
name: Open the paywall (App Store sandbox prices, QA log only) and check all three plans
---
# Maestro launches the app with simctl, so the local .storekit is NOT attached here and
# prices come from the App Store sandbox. The official 05-paywall is taken by the
# XCUITest (SimQATests) with the local StoreKit session. This flow is a cross-check.
# If a previous step left us on the document screen, get back to home first.
- runFlow:
    when:
      notVisible:
        id: "home-paywall"
    commands:
      - tapOn:
          text: "Cancel"
          optional: true
      - tapOn:
          id: "doc-back"
          optional: true
      - tapOn:
          text: "Back"
          optional: true
      - back
      - extendedWaitUntil:
          visible:
            id: "home-screen"
          timeout: 10000
          optional: true
- tapOn:
    id: "home-paywall"
- extendedWaitUntil:
    visible:
      id: "paywall-screen"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "paywall-close"
- assertVisible:
    id: "paywall-restore"
- assertVisible:
    id: "paywall-terms"
- assertVisible:
    id: "paywall-privacy"
- assertVisible:
    id: "paywall-autorenew"
# Plan cards sit below the fold; the lifetime card is last.
- scrollUntilVisible:
    element:
      id: "paywall-plan-lifetime"
    direction: DOWN
    timeout: 15000
- extendedWaitUntil:
    visible: ".*39\\.99.*one-time.*"
    timeout: 20000
- assertVisible: ".*2\\.99.*"
- assertVisible: ".*19\\.99.*"
- assertNotVisible: "Try 7 days free, then .*39\\.99.*"
- assertVisible:
    text: "Try 7 days free, then .*2\\.99.*/month"
    optional: true
- assertVisible:
    text: "Try 7 days free, then .*19\\.99.*/year"
    optional: true
- takeScreenshot: 05-paywall-sandbox
- tapOn:
    id: "paywall-close"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 10000
