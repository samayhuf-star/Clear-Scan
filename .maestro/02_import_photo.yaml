appId: com.samayhuf.clearscan
name: Import a seeded photo and reach the scan result
---
- assertVisible:
    id: "home-screen"
- tapOn:
    id: "home-import"
- tapOn:
    text: "Choose photos"
    optional: true
- tapOn:
    text: "Choose Photos"
    optional: true
# When the QA inbox file is present, import starts immediately and the system
# picker never appears. The QA hold keeps the overlay up about 12 s. Wait
# longer than that hold so we do not race it, and shoot as soon as it is up
# (a later when-visible check can miss it).
- extendedWaitUntil:
    visible:
      id: "scanning-screen"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible:
        id: "scanning-screen"
    commands:
      - takeScreenshot: 02-scanning
- runFlow:
    when:
      visible: ".*nothing leaves this device.*"
    commands:
      - takeScreenshot: 02-scanning
# Only poke the system picker when it is actually on screen. A blind
# 20%,30% tap (older flow) hit the scanning overlay on run 43493934205.
- runFlow:
    when:
      visible: "Allow Access to All Photos"
    commands:
      - tapOn:
          text: "Allow Access to All Photos"
          optional: true
      - tapOn:
          text: "Allow"
          optional: true
      - tapOn:
          text: "OK"
          optional: true
- runFlow:
    when:
      visible: "Recents"
    commands:
      - waitForAnimationToEnd:
          timeout: 4000
      - tapOn:
          text: "Allow"
          optional: true
      - tapOn:
          text: "Add"
          optional: true
      - tapOn:
          text: "Done"
          optional: true
      - tapOn:
          text: "Choose"
          optional: true
- extendedWaitUntil:
    visible:
      id: "scanning-screen"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "scanning-screen"
    commands:
      - takeScreenshot: 02-scanning
- runFlow:
    when:
      visible: ".*nothing leaves this device.*"
    commands:
      - takeScreenshot: 02-scanning
- extendedWaitUntil:
    visible:
      id: "doc-screen"
    timeout: 60000
# Let the "Saved" toast go, then show the recognised text for 03-result.
- extendedWaitUntil:
    notVisible: "Saved. Text read on-device"
    timeout: 10000
    optional: true
- tapOn:
    text: "Text"
    optional: true
- extendedWaitUntil:
    visible: ".*Amount due.*"
    timeout: 8000
    optional: true
- takeScreenshot: 03-result
